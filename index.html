<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLIS - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>TOOLIS</h1>
        </header>

        <div class="main-layout">
            <aside class="sidebar-section">
                <div class="section-card">
                    <h2 class="section-title">Task List</h2>
                    <ul class="task-list">
                    <li>
                        <label class="task-item">
                        <input type="checkbox" checked>
                        <span class="custom-checkbox"></span>
                        <span class="task-text">Menyelesaikan 4 css games</span>
                    </label>
                    </li>
                    <li>
                        <label class="task-item">
                            <input type="checkbox">
                            <span class="custom-checkbox"></span>
                            <span class="task-text">Membuat Webpage To-Do List</span>
                            </label>
                    </li>
                    <li>
                            <label class="task-item">
                            <input type="checkbox">
                            <span class="custom-checkbox"></span>
                            <span class="task-text">Mengerjakan Pre-Praktikum Jarkom</span>
                            </label>
                    </li>
                        <li>
                            <label class="task-item">
                            <input type="checkbox">
                            <span class="custom-checkbox"></span>
                            <span class="task-text">LBE RPL</span>
                            </label>
                        </li>
                    </ul>
                </div>
            </aside>

            <main class="content-section">
                <section class="section-card task-detail">
                    <h2 class="section-title">Task Detail</h2>
                    <div class="detail-container">
                        <p><strong>Title:</strong> Membuat Webpage To-Do List</p>
                        <p><strong>Status:</strong> <span class="status-badge on-progress">On Progress</span></p>
                        <p><strong>Deadline:</strong> 14 September 2026</p>
                        <div class="description-group">
                        <strong>Description:</strong>
                        <p class="description-text">Belajar cara membuat Webpage To-Do List.</p>
                    </div>
                    </div>
                </section>

                <section class="section-card add-task">
                    <h2 class="section-title">Add Task</h2>
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="task-title">Title</label>
                            <input type="text" id="task-title" name="judul" placeholder="Enter Title">
                        </div>
                        <div class="form-group">
                            <label for="task-desc">Description</label>
                            <textarea id="task-desc" name="deskripsi" placeholder="Enter Description" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="task-deadline">Deadline</label>
                            <input type="date" id="task-deadline" name="deadline">
                        </div>
                        <button type="submit" class="btn-save">Save</button>
                    </form>
                </section>
            </main>
        </div>

        <footer class="app-footer">
            <p>𖦹 Web Programming - Muhammad Aqsan</p>
        </footer>
    </div>
</body>
</html>
