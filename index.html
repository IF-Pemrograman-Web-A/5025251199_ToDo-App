<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLIS - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>TOOLIS</h1>
            <button id="theme-toggle" class="btn-theme">🌙 Dark Mode</button>
        </header>

        <div class="main-layout">
            <aside class="sidebar-section">
                <div class="section-card">
                    <h2 class="section-title">Task List</h2>
                    <!-- Kriteria 1: Ul diisi via JavaScript DOM -->
                    <ul id="task-list" class="task-list"></ul>
                </div>
            </aside>

            <main class="content-section">
                <section class="section-card task-detail">
                    <h2 class="section-title">Task Detail</h2>
                    <div class="detail-container">
                        <p><strong>Title:</strong> <span id="detail-title">-</span></p>
                        <p><strong>Status:</strong> <span id="detail-status" class="status-badge">-</span></p>
                        <p><strong>Deadline:</strong> <span id="detail-deadline">-</span></p>
                        <div class="description-group">
                            <strong>Description:</strong>
                            <p id="detail-desc" class="description-text">-</p>
                        </div>
                    </div>
                </section>

                <section class="section-card add-task">
                    <h2 id="form-title" class="section-title">Add Task</h2>
                    <form id="task-form">
                        <input type="hidden" id="task-id">
                        <div class="form-group">
                            <label for="task-title">Title</label>
                            <input type="text" id="task-title" placeholder="Enter Title" required>
                        </div>
                        <div class="form-group">
                            <label for="task-desc">Description</label>
                            <textarea id="task-desc" placeholder="Enter Description" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="task-deadline">Deadline</label>
                            <input type="date" id="task-deadline">
                        </div>
                        <button type="submit" id="btn-submit" class="btn-save">Save</button>
                    </form>
                </section>
            </main>
        </div>

        <footer class="app-footer">
            <p>𖦹 Web Programming - Muhammad Aqsan</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
